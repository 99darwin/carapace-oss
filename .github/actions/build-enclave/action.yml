name: Build enclave image
description: >
  Reproducibly build enclave/Dockerfile for linux/amd64 into an OCI tarball
  (and optionally push it) and report the image manifest digest.

inputs:
  push-ref:
    description: >
      Optional registry reference (name:tag) to push the same build to.
      Empty means build locally only.
    required: false
    default: ""

outputs:
  digest:
    description: linux/amd64 image manifest digest (sha256:...)
    value: ${{ steps.digest.outputs.digest }}
  epoch:
    description: SOURCE_DATE_EPOCH used for the build (commit time)
    value: ${{ steps.epoch.outputs.epoch }}

runs:
  using: composite
  steps:
    # BuildKit and buildx are pinned: the image bytes depend on the builder's
    # version (layer compression, rewrite-timestamp behaviour).
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.37.1
        driver: docker-container
        driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

    - id: epoch
      shell: bash
      run: echo "epoch=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

    - id: build
      shell: bash
      env:
        SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        PUSH_REF: ${{ inputs.push-ref }}
        # Pinned so the SBOM attestation is produced by a known scanner.
        SBOM_GENERATOR: docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      run: |
        set -euo pipefail
        outputs=(--output "type=oci,dest=${RUNNER_TEMP}/enclave.tar,rewrite-timestamp=true")
        if [ -n "$PUSH_REF" ]; then
          outputs+=(--output "type=registry,name=${PUSH_REF},rewrite-timestamp=true")
        fi
        docker buildx build \
          --file enclave/Dockerfile \
          --platform linux/amd64 \
          --provenance=mode=max \
          --sbom="generator=${SBOM_GENERATOR}" \
          --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
          --no-cache \
          "${outputs[@]}" \
          .

    - id: digest
      shell: bash
      run: |
        set -euo pipefail
        digest="$(python3 scripts/oci_image_digest.py "${RUNNER_TEMP}/enclave.tar")"
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        echo "linux/amd64 image manifest digest: ${digest}" >> "$GITHUB_STEP_SUMMARY"
