name: Server image

# Builds server/Dockerfile for linux/amd64 on every change to the server. On
# a v* tag whose commit is on the default branch, the image is pushed to
# ghcr.io/<owner>/<repo>/server:<tag> and signed keylessly with cosign, like
# the enclave image. Deploys pin the linux/amd64 manifest digest; see
# infra/pulumi/README.md for copying it into Artifact Registry.

on:
  pull_request:
    paths:
      - "server/**"
      - "packages/crypto/**"
      - "uv.lock"
      - "scripts/oci_image_digest.py"
      - ".github/workflows/server-image.yml"
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # BuildKit and buildx are pinned, as for the enclave image.
  BUILDX_VERSION: v0.37.1
  BUILDKIT_IMAGE: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
  SBOM_GENERATOR: docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

jobs:
  # The file-based guards (pinned bases, non-root, explicit COPY list,
  # hash-locked requirements). A tag must pass them too; CI on the branch is
  # not a prerequisite for a tag push.
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: uv run pytest server/tests/test_image_build.py server/tests/test_entrypoint.py

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker-container
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build
        run: |
          set -euo pipefail
          docker buildx build \
            --file server/Dockerfile \
            --platform linux/amd64 \
            --no-cache \
            --output "type=oci,dest=${RUNNER_TEMP}/server.tar" \
            .
          digest="$(python3 scripts/oci_image_digest.py "${RUNNER_TEMP}/server.tar")"
          echo "linux/amd64 image manifest digest: ${digest}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [guards, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing (Fulcio OIDC)
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: ref
        name: Validate the tag and its commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::unexpected tag name"; exit 1
          fi
          commit="$(git rev-parse 'HEAD^{commit}')"
          # Anyone who can push a tag could otherwise publish unreviewed code.
          status="$(gh api "repos/${GH_REPO}/compare/${DEFAULT_BRANCH}...${commit}" \
            --jq .status)"
          case "$status" in
            identical|behind) ;;
            *)
              echo "::error::${TAG} points at ${commit}, which is not on" \
                "${DEFAULT_BRANCH} (compare status: ${status})"
              exit 1 ;;
          esac
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/server" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker-container
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - id: build
        name: Build and push
        env:
          PUSH_REF: ${{ steps.ref.outputs.image }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file server/Dockerfile \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom="generator=${SBOM_GENERATOR}" \
            --no-cache \
            --output "type=oci,dest=${RUNNER_TEMP}/server.tar" \
            --output "type=registry,name=${PUSH_REF}" \
            .
          digest="$(python3 scripts/oci_image_digest.py "${RUNNER_TEMP}/server.tar")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # The digest above comes from the local OCI tarball. Ask the registry
      # what the tag now serves for linux/amd64 before signing anything.
      - name: Require the registry to serve the built manifest
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image }}:${{ github.ref_name }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          registry_digest="$(docker buildx imagetools inspect --raw "$IMAGE_REF" \
            | jq -r '[.manifests[]?
                      | select(.platform.os == "linux"
                               and .platform.architecture == "amd64"
                               and (.annotations["vnd.docker.reference.type"] == null))
                      | .digest]
                     | if length == 1 then .[0] else "ambiguous" end')"
          if [ "$registry_digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::${IMAGE_REF} serves ${registry_digest} for linux/amd64," \
              "built ${EXPECTED_DIGEST}"
            exit 1
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image manifest
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Server image: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
