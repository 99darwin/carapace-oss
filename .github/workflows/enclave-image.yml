name: Enclave image

# Builds the enclave image on two different runners and fails unless both
# produce the same linux/amd64 image manifest digest. On a v* tag the image
# is pushed, signed keylessly with cosign, and releases/<tag>.json is attached
# to the GitHub release.
#
# A tag becomes a release only if its commit is already on the default
# branch, and a tag's release manifest is never rewritten: moving a tag to
# another commit fails the run before anything is pushed or signed.

on:
  pull_request:
    paths:
      - "enclave/**"
      - "packages/crypto/**"
      - "uv.lock"
      - "scripts/oci_image_digest.py"
      - ".github/actions/build-enclave/**"
      - ".github/workflows/enclave-image.yml"
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: enclave-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      epoch: ${{ steps.build.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-enclave

  build-b:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      epoch: ${{ steps.build.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-enclave

  compare:
    needs: [build-a, build-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ needs.build-a.outputs.digest }}
      epoch: ${{ needs.build-a.outputs.epoch }}
    steps:
      - name: Require identical digests
        env:
          DIGEST_A: ${{ needs.build-a.outputs.digest }}
          DIGEST_B: ${{ needs.build-b.outputs.digest }}
          EPOCH_A: ${{ needs.build-a.outputs.epoch }}
          EPOCH_B: ${{ needs.build-b.outputs.epoch }}
        run: |
          set -euo pipefail
          echo "ubuntu-24.04: ${DIGEST_A}"
          echo "ubuntu-22.04: ${DIGEST_B}"
          if ! [[ "$DIGEST_A" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build-a produced no valid digest"; exit 1
          fi
          if [ "$EPOCH_A" != "$EPOCH_B" ]; then
            echo "::error::SOURCE_DATE_EPOCH differs: ${EPOCH_A} vs ${EPOCH_B}"; exit 1
          fi
          if [ "$DIGEST_A" != "$DIGEST_B" ]; then
            echo "::error::enclave image is not reproducible: ${DIGEST_A} != ${DIGEST_B}"
            exit 1
          fi
          echo "Reproducible: ${DIGEST_A}" >> "$GITHUB_STEP_SUMMARY"

  # The file-based guards (launch policy matches infra, explicit COPY list,
  # hash-locked requirements, pinned actions). A tag must pass them too; CI
  # on the branch is not a prerequisite for a tag push.
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: uv run pytest enclave/tests/test_image_build.py

  publish:
    needs: [compare, guards]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # upload release assets
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing (Fulcio OIDC)
    env:
      TAG: ${{ github.ref_name }}
      EXPECTED_DIGEST: ${{ needs.compare.outputs.digest }}
      EPOCH: ${{ needs.compare.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Everything that can refuse the release runs here, before the image is
      # pushed or anything is signed.
      - id: ref
        name: Validate the tag, its commit and any existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::unexpected tag name"; exit 1
          fi
          # GITHUB_SHA is the tag object for an annotated tag; record the commit.
          commit="$(git rev-parse 'HEAD^{commit}')"

          # Anyone who can push a tag could otherwise release unreviewed code.
          status="$(gh api "repos/${GH_REPO}/compare/${DEFAULT_BRANCH}...${commit}" \
            --jq .status)"
          case "$status" in
            identical|behind) ;;
            *)
              echo "::error::${TAG} points at ${commit}, which is not on" \
                "${DEFAULT_BRANCH} (compare status: ${status})"
              exit 1 ;;
          esac

          # A published manifest is immutable. A moved tag must fail, and a
          # re-run of the same release must not re-sign or re-upload.
          published="${RUNNER_TEMP}/published.json"
          already=false
          if gh release download "$TAG" --pattern "${TAG}.json" \
               --output "$published" 2> /dev/null; then
            if [ "$(jq -r .digest "$published")" != "$EXPECTED_DIGEST" ] \
               || [ "$(jq -r .commit "$published")" != "$commit" ]; then
              echo "::error::${TAG} already has a release manifest for another" \
                "image or commit; release manifests are immutable, cut a new tag"
              exit 1
            fi
            already=true
          fi

          {
            echo "commit=${commit}"
            echo "already_published=${already}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/enclave"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A third build of the same commit; it pushes, and must match the digest
      # both independent builders agreed on before anything is signed.
      - id: build
        uses: ./.github/actions/build-enclave
        with:
          push-ref: ${{ steps.ref.outputs.image }}:${{ github.ref_name }}

      - name: Require the pushed digest to match the reproduced one
        env:
          PUSHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$PUSHED_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "::error::pushed ${PUSHED_DIGEST}, reproduced ${EXPECTED_DIGEST}"
            exit 1
          fi

      # The digest above comes from the local OCI tarball. Ask the registry
      # what the tag now serves for linux/amd64 before signing anything.
      - name: Require the registry to serve the reproduced manifest
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          registry_digest="$(docker buildx imagetools inspect --raw "$IMAGE_REF" \
            | jq -r '[.manifests[]?
                      | select(.platform.os == "linux"
                               and .platform.architecture == "amd64"
                               and (.annotations["vnd.docker.reference.type"] == null))
                      | .digest]
                     | if length == 1 then .[0] else "ambiguous" end')"
          if [ "$registry_digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::${IMAGE_REF} serves ${registry_digest} for linux/amd64," \
              "reproduced ${EXPECTED_DIGEST}"
            exit 1
          fi

      - if: steps.ref.outputs.already_published != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - if: steps.ref.outputs.already_published != 'true'
        name: Sign the image manifest
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${EXPECTED_DIGEST}"

      - if: steps.ref.outputs.already_published != 'true'
        name: Write and sign the release manifest
        env:
          COMMIT: ${{ steps.ref.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p releases
          jq -n \
            --arg tag "$TAG" \
            --arg digest "$EXPECTED_DIGEST" \
            --arg commit "$COMMIT" \
            --argjson epoch "$EPOCH" \
            '{tag: $tag, digest: $digest, commit: $commit, epoch: $epoch}' \
            > "releases/${TAG}.json"
          cat "releases/${TAG}.json"
          cosign sign-blob --yes \
            --bundle "releases/${TAG}.json.sigstore.json" \
            "releases/${TAG}.json"

      - if: steps.ref.outputs.already_published != 'true'
        name: Attach the release manifest to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "Enclave image: ${EXPECTED_DIGEST}"
          fi
          # Never overwrite: an asset that appeared since the check fails.
          gh release upload "$TAG" \
            "releases/${TAG}.json" "releases/${TAG}.json.sigstore.json"
