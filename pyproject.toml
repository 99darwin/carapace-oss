[project]
name = "carapace-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "enclave", "server"]

[tool.ruff]
line-length = 88
target-version = "py312"
# Lets isort classify workspace packages as first-party.
src = [".", "server/src", "packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["carapace_*"]

[tool.ruff.lint.per-file-ignores]
# Tests assert freely and use fixed fake credentials.
"**/tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
