[project]
name = "carapace-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    # enclave/mock (dev-only, never packaged) signs fake attestation tokens.
    "pyjwt[crypto]>=2.9",
    "pytest>=8",
    "ruff>=0.6",
    # Deploy tests import the real modules; every call they make is mocked.
    "carapace-cli[deploy]",
]

[tool.uv]
package = false

[tool.uv.sources]
carapace-cli = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "enclave", "server", "cli"]

[tool.ruff]
line-length = 88
target-version = "py312"
# Lets isort classify workspace packages as first-party.
src = [
    ".", "server/src", "packages/*/src", "enclave/src", "enclave/mock", "cli/src"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["carapace_*"]

[tool.ruff.lint.per-file-ignores]
# Tests assert freely and use fixed fake credentials.
"**/tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
# Plain helper modules next to the tests (server/tests/server_support.py,
# cli/tests/cli_support.py),
# and the dev-only enclave mock, which is deliberately not a distribution.
pythonpath = ["server/tests", "cli/tests", "enclave/mock"]
