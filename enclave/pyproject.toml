[project]
name = "carapace-enclave"
version = "0.1.0"
description = "Carapace enclave: credential-injecting egress proxy for Confidential Space"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "idna>=3.7",
    "pydantic>=2.7,<3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carapace_enclave"]
